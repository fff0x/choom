<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>choom &mdash; shared terminal (read-only)</title>
<link rel="stylesheet" href="/static/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc;
               font-family: monospace; overflow: hidden; }
  #bar { padding: 4px 8px; background: #111; font-size: 13px;
         border-bottom: 1px solid #333; height: 20px; line-height: 20px; }
  #bar .ro { color: #fa0; }
  #cast { color: #6cf; }
  #cast.hidden { display: none; }
  /* The terminal renders at the host's exact grid size and is scaled to fit. */
  #term { position: absolute; top: 29px; left: 0; right: 0; bottom: 0;
          overflow: hidden; }
  #term .xterm { transform-origin: top left; }
</style>
</head>
<body>
  <div id="bar"><span class="ro">&#9679; READ-ONLY</span>
    &nbsp;&mdash;&nbsp; choom shared terminal
    &nbsp;&middot;&nbsp; <a id="cast" class="hidden" href="#">download recording</a>
    &nbsp;&middot;&nbsp; <span id="status">connecting&hellip;</span></div>
  <div id="term"></div>
  <script src="/static/xterm.js"></script>
  <script>
    // Token from the path /s/<token> -- no cookies, no ambient authority.
    var parts = location.pathname.split('/');
    var token = parts[2] || '';

    var statusEl = document.getElementById('status');
    var cast = document.getElementById('cast');
    cast.href = '/s/' + token + '/cast';

    var term = new Terminal({ convertEol: false, scrollback: 1000,
                              cursorBlink: false, fontFamily: 'monospace' });
    term.open(document.getElementById('term'));
    // Read-only: any keyboard input in the browser is discarded.
    term.attachCustomKeyEventHandler(function () { return false; });

    // Scale the fixed terminal grid to fit the window (contain: never cut off).
    function fit() {
      var el = term.element;
      if (!el) return;
      el.style.transform = 'none';
      var natW = el.offsetWidth, natH = el.offsetHeight;
      if (!natW || !natH) return;
      var box = document.getElementById('term');
      var s = Math.min(box.clientWidth / natW, box.clientHeight / natH);
      el.style.transform = 'scale(' + s + ')';
    }
    var fitPending = false;
    function scheduleFit() {
      if (fitPending) return;
      fitPending = true;
      requestAnimationFrame(function () { fitPending = false; fit(); });
    }
    window.addEventListener('resize', scheduleFit);

    function applySize(cols, rows) {
      if (cols > 0 && rows > 0 && (cols !== term.cols || rows !== term.rows)) {
        term.resize(cols, rows);
      }
      scheduleFit();
    }

    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    var ws = new WebSocket(proto + '://' + location.host + '/s/' + token + '/stream');
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { statusEl.textContent = 'live'; };
    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string') {
        // control frame: terminal size / init (recording availability)
        var m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'init') {
          if (m.rec) { cast.classList.remove('hidden'); }
          applySize(m.cols, m.rows);
        } else if (m.t === 'size') {
          applySize(m.cols, m.rows);
        }
        return;
      }
      term.write(new Uint8Array(ev.data));
      scheduleFit();
    };
    ws.onclose = function () { statusEl.textContent = 'disconnected'; };
    ws.onerror = function () { statusEl.textContent = 'error'; };
  </script>
</body>
</html>
