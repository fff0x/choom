# choom task runner — `task <name>` (https://taskfile.dev)
# The flake devShell (direnv) puts cargo/rustfmt/clippy/nix on PATH.
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: build the Rust workspace
    cmds:
      - cargo build --workspace

  test:
    desc: run the test suite (pass extra args after --)
    cmds:
      - "cargo test --workspace {{.CLI_ARGS}}"

  check:
    desc: the full gate — fmt + clippy + test
    cmds:
      - cargo fmt --all --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --workspace

  fmt:
    desc: format the workspace (Rust + nix)
    cmds:
      - cargo fmt --all
      - nix fmt

  run:
    desc: run choom (e.g. task run -- server -w 0.0.0.0:8080)
    cmds:
      - "cargo run -p choom-cli -- {{.CLI_ARGS}}"

  nix-build:
    desc: build the choom binary with nix (crane)
    cmds:
      - "nix build .#choom"

  man:
    desc: regenerate the man pages from the CLI into man/
    cmds:
      - cargo run -p xtask

  image:
    desc: build the relay container image (static musl on scratch)
    vars:
      TAG: '{{.TAG | default "choom/relay:dev"}}'
    cmds:
      - "docker build -t {{.TAG}} ."

  clean:
    desc: remove build artifacts
    cmds:
      - rm -rf target result
