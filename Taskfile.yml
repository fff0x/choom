# choom task runner — `task <name>` (https://taskfile.dev)
# Inside the flake devShell (direnv) python/pytest/nix are on PATH.
version: "3"

vars:
  PY: .venv/bin/python

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: create venv + editable install (with test deps)
    cmds:
      - python3 -m venv .venv
      - "{{.PY}} -m pip install -e '.[test]'"

  test:
    desc: run the test suite (pass extra args after --)
    cmds:
      - "{{.PY}} -m pytest {{.CLI_ARGS}}"

  build:
    desc: build the choom package with nix
    cmds:
      - "nix build .#choom"

  run:
    desc: run choom from the flake (e.g. task run -- host)
    cmds:
      - "nix run .#choom -- {{.CLI_ARGS}}"

  image:
    desc: build the relay container image
    vars:
      TAG: '{{.TAG | default "choom/relay:dev"}}'
    cmds:
      - "docker build -t {{.TAG}} ."

  binary:
    desc: build a portable single-file binary into ./downloads (Nuitka)
    cmds:
      - ./tools/build-binaries.sh

  fmt:
    desc: format nix files
    cmds:
      - nix fmt

  clean:
    desc: remove build artifacts
    cmds:
      - rm -rf .venv downloads result .pytest_cache
