# choom/relay — Helm values
# Used with charts/generic. See README.md in this directory.

fullnameOverride: choom-relay
nameOverride: choom-relay

image:
  registry: oci.this-is-fine.io
  repository: choom/relay
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
strategy: Recreate
containerName: choom

# choom never runs a shell itself (it only relays bytes), so it runs unprivileged
# — unlike tmate-ssh-server, which needs root + SYS_ADMIN for session jailing.
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  enabled: true
  type: ClusterIP

ports:
  - name: ssh
    containerPort: 2200
  - name: http
    containerPort: 8080

env:
  # Public FQDN clients dial — must match the routable address.
  - name: CHOOM_HOSTNAME
    value: choom.example.com
  - name: CHOOM_PORT_LISTEN
    value: "2200"
  - name: CHOOM_PORT_ADVERTISE
    value: "2200"
  # Bind the web view to all interfaces; advertise the TLS URL terminated upstream.
  - name: CHOOM_WEB
    value: "0.0.0.0:8080"
  - name: CHOOM_WEB_URL
    value: https://choom.example.com
  # Private server: stop trusting the built-in default key, gate hosts via
  # your own authorized_keys mounted into /choom/data/authorized_keys.
  # - name: CHOOM_NO_DEFAULT_KEY
  #   value: "1"
  # Session recording (asciicast) under /choom/data/recordings, downloadable at
  # /s/<ro-token>/cast. NOTE: records EVERY session and may capture on-screen
  # secrets; set to "0" (or remove) to disable.
  - name: CHOOM_RECORD
    value: "1"

# Host key (and optionally authorized_keys / recordings) live here and must
# persist so the advertised server fingerprint stays stable across restarts.
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /choom/data

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
