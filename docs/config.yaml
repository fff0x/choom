# Example choom config. Pass with `choom server -c choom.yaml` (or `choom host -c …`).
# Keys are the snake_case field names below (unknown keys are rejected).
# Precedence: explicit CLI flag > this file > built-in default.

# --- server (choom server -c choom.yaml) ---
ssh_addr: "0.0.0.0:2200"          # --ssh-addr   address to listen for SSH on
host: choom.example.com           # -H           FQDN advertised in the share links
port: 2200                        # -p           SSH port advertised in the links
web: "0.0.0.0:8080"               # -w           web view bind address (omit to disable)
web_url: https://choom.example.com  # -W         public URL advertised (behind a TLS gateway)
metrics_addr: "127.0.0.1:9090"    # --metrics-addr  operator-internal Prometheus endpoint;
                                  #              keep it OFF the public web port — bind to
                                  #              loopback/private iface (omit = disabled)

# host gating
use_default_key: true             # false on a private relay (== --no-default-key)
# authorized_keys:                # -a, OpenSSH pubkey lines allowed to host
#   - "ssh-ed25519 AAAA... alice"
# host_key: /var/lib/choom/host_key  # persistent SSH host key (stable fingerprint;
#                                    # default: ephemeral, regenerated each start)

# recording (hosts opt in with `choom host --record`)
# record_dir: /var/lib/choom/rec  # -r, a directory enables recording storage (omit = off)
record_all: false                 # --record-all, record every session regardless
record_max_age_days: 7
record_max_mb: 500

# resource limits
max_sessions: 200
max_viewers: 50
rate_limit: 60                    # new connections / source IP / minute (0 = off)

# downloads: /var/lib/choom/dl    # serve prebuilt binaries at /download (omit = off)

# --- host (choom host -c choom.yaml) ---
# server: choom.example.com
# port: 2200                        # -p, relay SSH port to dial
# shell: /bin/bash
# record: false                   # ask the relay to record this session
# identity: ~/.ssh/id_ed25519     # -i, overrides the bundled default key
# use_default_key: true           # false == --no-default-key
# fingerprint: "SHA256:…"         # verify the relay host key on connect
# detach: false                   # remote-support mode: don't attach the local terminal
# verbose: false                  # -v, print connection diagnostics (resolved address,
#                                 # connect attempts, relay host-key fingerprint, auth)
